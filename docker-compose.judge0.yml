# Judge0 CE - Code Execution Engine for DSA Round
#
# Usage:
#   docker compose -f docker-compose.judge0.yml up -d
#
# Verify it's running (note the host port is 2359, mapped to 2358 in-container):
#   curl -H "X-Auth-Token: $JUDGE0_AUTH_TOKEN" http://127.0.0.1:2359/languages
#
# Stop:
#   docker compose -f docker-compose.judge0.yml down
#
# ---------------------------------------------------------------------------
# SECURITY -- read before exposing this beyond localhost
# ---------------------------------------------------------------------------
# This stack executes untrusted, user-submitted code. Two properties matter:
#
# 1. `privileged: true` is REQUIRED, not incidental. Judge0 sandboxes runs with
#    `isolate`, which needs cgroup and namespace control the container cannot
#    get otherwise. Removing it does not harden the stack -- it breaks
#    execution. The correct mitigation is network isolation: this must never be
#    reachable from anything except the backend.
#
# 2. Authentication is now ON by default. It was previously disabled outright
#    ("Disable authentication for local dev"), which meant anything able to
#    reach the port could execute arbitrary code on the host. Set
#    JUDGE0_AUTH_TOKEN and JUDGE0_WORKER_TOKEN in your environment or a .env
#    file next to this compose file; both are required and the stack will not
#    start without them.
#
# Generate tokens with:
#   python -c "import secrets; print(secrets.token_urlsafe(32))"
#
# The backend must then send the token. Set JUDGE0_AUTH_TOKEN in the backend's
# environment too -- see backend/dsa/code_executor.py.

name: judge0

services:
  judge0-server:
    image: judge0/judge0:1.13.1
    ports:
      - "2359:2358"
    environment:
      - POSTGRES_HOST=judge0-db
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=${JUDGE0_POSTGRES_PASSWORD:?set JUDGE0_POSTGRES_PASSWORD}
      - REDIS_HOST=judge0-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${JUDGE0_REDIS_PASSWORD:?set JUDGE0_REDIS_PASSWORD}
      # Execution limits (match backend/config.py defaults)
      - CPU_TIME_LIMIT=2
      - CPU_EXTRA_TIME=1
      - WALL_TIME_LIMIT=4
      - MEMORY_LIMIT=262144
      - MAX_PROCESSES_AND_OR_THREADS=60
      - ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
      - ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true
      # Authentication ON. Required -- compose refuses to start if unset.
      - AUTHN_HEADER=X-Auth-Token
      - AUTHN_TOKEN=${JUDGE0_AUTH_TOKEN:?set JUDGE0_AUTH_TOKEN (see header comment)}
      - AUTHZ_HEADER=X-Auth-User
      - AUTHZ_TOKEN=${JUDGE0_WORKER_TOKEN:?set JUDGE0_WORKER_TOKEN (see header comment)}
    privileged: true
    restart: unless-stopped
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy

  judge0-worker:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    environment:
      - POSTGRES_HOST=judge0-db
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=${JUDGE0_POSTGRES_PASSWORD:?set JUDGE0_POSTGRES_PASSWORD}
      - REDIS_HOST=judge0-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${JUDGE0_REDIS_PASSWORD:?set JUDGE0_REDIS_PASSWORD}
      - CPU_TIME_LIMIT=2
      - CPU_EXTRA_TIME=1
      - WALL_TIME_LIMIT=4
      - MEMORY_LIMIT=262144
      - MAX_PROCESSES_AND_OR_THREADS=60
      - ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
      - ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true
    privileged: true
    restart: unless-stopped
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy

  judge0-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=${JUDGE0_POSTGRES_PASSWORD:?set JUDGE0_POSTGRES_PASSWORD}
    volumes:
      - judge0-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  judge0-redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${JUDGE0_REDIS_PASSWORD:?set JUDGE0_REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${JUDGE0_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  judge0-db-data:
