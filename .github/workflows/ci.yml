name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the in-progress run, so CI does not
# queue up behind superseded commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # No MongoDB service: the suite mocks the repository layer throughout and
    # passes against an unreachable database, so a service container would only
    # add startup time. Add one here if integration tests are introduced.

    env:
      # config.py refuses to load without this. The value is irrelevant to the
      # tests — they only need it to be present and non-empty.
      AUTH_JWT_SECRET: ci-test-secret-not-used-outside-ci
      # Points at a port nothing is listening on, so an accidental real database
      # call fails loudly instead of silently passing against leftover state.
      MONGO_URI: mongodb://127.0.0.1:59999
      MONGO_DB_NAME: interview_simulator_ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches backend/Dockerfile so CI validates the version that ships.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch. sentence-transformers pulls torch in, and the default
          # Linux wheel is the CUDA build (~2.5 GB) that this project never uses.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r backend/requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" --verbose

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly the lockfile and fails if it has drifted from
      # package.json, which is a check in its own right.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only gate merges on this once the faster jobs pass — image builds are the
    # slowest step and a compile-level failure will surface above first.
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
