name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the in-progress run, so CI does not
# queue up behind superseded commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # tests/test_database_integration.py drives MongoRepository against a real
    # database, so a service container is now needed. It replaces the note that
    # used to stand here saying one would be required "if integration tests are
    # introduced" — they have been, because the rest of the suite mocks the
    # repository layer and so had never executed a single real query, index, or
    # concurrency check.
    #
    # Those tests skip themselves when no database is reachable, so a
    # contributor without MongoDB still gets a green local suite. They must not
    # skip here, which is what the guard step below enforces.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # config.py refuses to load without this. The value is irrelevant to the
      # tests — they only need it to be present and non-empty.
      AUTH_JWT_SECRET: ci-test-secret-not-used-outside-ci
      # The unit tests mock the repository layer and must not reach a database,
      # so this still points at a port nothing listens on: an accidental real
      # call fails loudly instead of passing against leftover state.
      MONGO_URI: mongodb://127.0.0.1:59999
      MONGO_DB_NAME: interview_simulator_ci
      # The integration tests read this one instead, and each creates its own
      # throwaway database that it drops afterwards.
      MONGO_TEST_URI: mongodb://127.0.0.1:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches backend/Dockerfile so CI validates the version that ships.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch. sentence-transformers pulls torch in, and the default
          # Linux wheel is the CUDA build (~2.5 GB) that this project never uses.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r backend/requirements.txt

      # The suite is not hermetic: importing the app calls
      # warmup_semantic_encoder(), which fetches all-MiniLM-L6-v2 from the
      # HuggingFace Hub. A local run makes ~35 Hub requests, and the Hub itself
      # warns that they are unauthenticated and therefore rate limited. Without
      # this cache, every CI run re-downloads the model and a Hub rate limit or
      # outage fails the build for reasons unrelated to the code.
      #
      # Keyed on the model name so that changing the model invalidates the cache
      # rather than silently testing against the old one.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-${{ runner.os }}

      # A service container that fails to come up would make the integration
      # tests skip themselves, and the suite would still report success with
      # zero real database coverage. That is the same failure mode as the Node
      # glob above: a green run that tested nothing. Assert the database is
      # actually reachable from the runner before trusting the result.
      - name: Verify MongoDB is reachable
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017
        run: |
          python - <<'PY'
          import os, sys
          import pymongo
          uri = os.environ["MONGO_TEST_URI"]
          client = pymongo.MongoClient(uri, serverSelectionTimeoutMS=20000)
          try:
              version = client.server_info()["version"]
          except Exception as exc:
              sys.exit(f"MongoDB unreachable at {uri}: {exc}")
          finally:
              client.close()
          print(f"MongoDB {version} reachable at {uri}")
          PY

      # -t . is not optional. Without it, unittest sets the top-level directory
      # to tests/ instead of the repository root, which puts tests/ on sys.path
      # in place of the root. On Windows that combination crashes the
      # interpreter outright — an access violation (0xC0000005) with zero
      # output, not a test failure. With -t . the same suite reports 414
      # passing tests. This job had never run, so nothing caught it.
      - name: Run tests
        run: python -m unittest discover -s tests -t . -p "test_*.py" --verbose

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 24, not 20. The `test` script in package.json passes a glob
          # ("src/**/*.test.js") to `node --test`, and glob expansion inside
          # the test runner only arrived in Node 21 — on Node 20 the pattern is
          # taken as a literal path and no tests run. 24 is the version the
          # suite was actually verified green on (19 tests, 6 suites).
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly the lockfile and fails if it has drifted from
      # package.json, which is a check in its own right.
      - name: Install dependencies
        run: npm ci

      # The reducer tests existed alongside an `npm test` script but were never
      # wired into CI, so they had never run here. Before Build, because a unit
      # failure should surface faster than a bundle.
      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only gate merges on this once the faster jobs pass — image builds are the
    # slowest step and a compile-level failure will surface above first.
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
